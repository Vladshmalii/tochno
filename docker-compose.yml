# Повний стек: Postgres + API (+воркер у процесі) + кабінет + адмінка + лендинг.
# Перед запуском: cp .env.example .env і заповніть значення.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tochno
      POSTGRES_USER: tochno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tochno"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      APP_ENV: prod
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://tochno:${POSTGRES_PASSWORD}@db:5432/tochno
      STORAGE_DIR: /data/storage
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@tochno.app}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes: [files:/data/storage]
    ports: ["8000:8000"]

  client:
    build:
      context: .
      dockerfile: frontend/Dockerfile.web
      args: { APP: client-web, VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:8000}" }
    ports: ["8080:80"]

  admin:
    build:
      context: .
      dockerfile: frontend/Dockerfile.web
      args: { APP: admin-web, VITE_API_URL: "${PUBLIC_API_URL:-http://localhost:8000}" }
    ports: ["8081:80"]

  landing:
    build: ./landing
    ports: ["8082:80"]

volumes:
  pgdata:
  files:
