name: ci-cd
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  API_URL: https://docsai-backend.dvms.tech
  CLIENT_URL: https://docsai-client.dvms.tech
  DEPLOY_PATH: /opt/docsai

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

  # Образи в GHCR — лише для push у main (або ручного запуску з main)
  build:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [api, web]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            context: backend
            dockerfile: backend/Dockerfile
            build_args: ""
          - name: client
            context: .
            dockerfile: frontend/Dockerfile.web
            build_args: |
              APP=client-web
              VITE_API_URL=https://docsai-backend.dvms.tech
          - name: admin
            context: .
            dockerfile: frontend/Dockerfile.web
            build_args: |
              APP=admin-web
              VITE_API_URL=https://docsai-backend.dvms.tech
              VITE_CLIENT_URL=https://docsai-client.dvms.tech
          - name: landing
            context: landing
            dockerfile: landing/Dockerfile
            build_args: |
              APP_URL=https://docsai-client.dvms.tech
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tochno-${{ matrix.name }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency: { group: deploy-production, cancel-in-progress: false }
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4

      - name: SSH setup
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $SSH_HOST
            Port $SSH_PORT
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
          EOF

      - name: Upload compose file
        run: scp deploy/docker-compose.yml deploy/deploy.sh server:"$DEPLOY_PATH/"

      - name: Pull & restart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh server bash "$DEPLOY_PATH/deploy.sh" \
            "$GITHUB_SHA" "$GITHUB_ACTOR" "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tochno"

      - name: Health check
        run: |
          for url in "$API_URL/api/health" "$CLIENT_URL" https://docsai-admin.dvms.tech https://docsai.dvms.tech; do
            for i in $(seq 1 20); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
              [ "$code" = 200 ] && { echo "OK  $url"; continue 2; }
              sleep 6
            done
            echo "::error::$url -> $code"; exit 1
          done
